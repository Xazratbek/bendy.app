name: Release BendyLocal

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish DMG
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check tag version
        run: |
          bundle_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$bundle_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match bundle version $bundle_version"
            exit 1
          fi

      - name: Build DMG
        run: make dmg

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .dist/BendyLocal-*.dmg --generate-notes --title "$GITHUB_REF_NAME"