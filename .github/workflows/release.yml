name: Release BendyLocal

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Publish DMG
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check tag version
        run: |
          bundle_version=$(sed -n '/CFBundleShortVersionString/{n;s:.*<string>\(.*\)</string>.*:\1:p;}' Resources/Info.plist)
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$bundle_version" != "$tag_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match bundle version $bundle_version"
            exit 1
          fi

      - name: Check packaged DMG
        run: test -f ".dist/BendyLocal-${GITHUB_REF_NAME#v}.dmg"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ".dist/BendyLocal-${GITHUB_REF_NAME#v}.dmg" --generate-notes --title "$GITHUB_REF_NAME"